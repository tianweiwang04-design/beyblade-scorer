<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover">
<title>BEYBLADE X 比賽計分板</title>
<meta name="description" content="Beyblade X 三對三比賽計分板：官方 Finish 計分、3-2-1 Go Shoot 倒數、回合戰報與配置統計。">
<meta name="theme-color" content="#04060f">
<meta name="color-scheme" content="dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="BEY SCORER">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%2304060f'/%3E%3Ccircle cx='16' cy='16' r='9' fill='none' stroke='%23e01f2d' stroke-width='3'/%3E%3Ccircle cx='16' cy='16' r='3' fill='%233fd0f0'/%3E%3C/svg%3E">
<style>
:root{
  --bg:#04060f; --panel:rgba(255,255,255,.045); --line:rgba(255,255,255,.11);
  --txt:#e9edff; --dim:#7f89ad;
  /* 取色自 BEYBLADE X 主視覺海報的兩顆主角陀螺 */
  --chrome:#eef2fb;                                   /* 兩顆共通的白鉻裝甲 */
  /* A — 海報左側：深紅核心 × 橙焰 */
  --a1:#e01f2d; --a2:#ff6a2b; --a3:#ffd6b4; --aDeep:#780d16;
  --aGlow:rgba(224,31,45,.42); --aSoft:rgba(224,31,45,.30);
  /* B — 海報右側：深藍核心 × 青龍 */
  --b1:#1b5fd6; --b2:#3fd0f0; --b3:#cfe9ff; --bDeep:#0a2a6e;
  --bGlow:rgba(45,140,255,.42); --bSoft:rgba(27,95,214,.32);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{touch-action:manipulation;-webkit-text-size-adjust:100%;text-size-adjust:100%}
html{min-height:100%;overflow-x:hidden;
  background:
    /* 細網格，像 X 賽道的紋理 */
    repeating-linear-gradient(90deg,rgba(255,255,255,.028) 0 1px,transparent 1px 68px),
    repeating-linear-gradient(0deg,rgba(255,255,255,.022) 0 1px,transparent 1px 68px),
    /* 海報頂端那道青綠色的 X 光束 */
    radial-gradient(46% 32% at 50% 1%,rgba(46,230,200,.14),transparent 72%),
    radial-gradient(26% 18% at 50% 0%,rgba(120,255,238,.10),transparent 70%),
    /* 左：紅核心 ＋ 橙焰 */
    radial-gradient(76% 60% at 3% 104%,rgba(255,106,43,.20),transparent 62%),
    radial-gradient(120% 76% at 16% 102%,var(--aGlow),transparent 60%),
    /* 右：藍核心 ＋ 青龍 */
    radial-gradient(76% 60% at 97% 104%,rgba(63,208,240,.20),transparent 62%),
    radial-gradient(120% 76% at 84% 102%,var(--bGlow),transparent 60%),
    var(--bg);
  background-repeat:no-repeat;background-color:var(--bg)}
body{
  margin:0;background:transparent;
  /* iOS 主畫面模式剛開啟時 dvh 會少掉狀態列的高度，底部因此露出黑帶；
     vh 指的是「大視窗」，從頭到尾都等於整個螢幕，所以用 vh 不用 dvh */
  min-height:100vh;min-height:100lvh;
  color:var(--txt);font-family:"Chakra Petch",-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang TC","Noto Sans TC",sans-serif;
  overflow-x:hidden;display:flex;flex-direction:column;
}
.scroll{display:contents}
.center{position:relative;z-index:1}
.top,.board,.cfg,.src{position:relative;z-index:1}
button{font-family:inherit;color:inherit;cursor:pointer;border:0;background:none}

/* ---------- top bar ---------- */
.top{display:flex;align-items:center;flex-wrap:wrap;gap:8px;position:relative;z-index:5;flex:none;
  padding:calc(10px + env(safe-area-inset-top)) calc(14px + env(safe-area-inset-right))
          10px calc(14px + env(safe-area-inset-left))}
.brand{font-weight:900;letter-spacing:.24em;font-size:12px;flex:none;white-space:nowrap;
  background-image:linear-gradient(90deg,var(--a2),var(--a1) 28%,var(--chrome) 50%,var(--b2) 74%,var(--b1));
  background-clip:text;-webkit-background-clip:text;color:transparent}
.top .sp{flex:1}
.tbtn{border:1px solid var(--line);background:rgba(255,255,255,.04);border-radius:999px;
  padding:7px 14px;font-size:12px;letter-spacing:.08em;font-weight:600;transition:.18s;
  flex:none;white-space:nowrap}
.tbtn:hover{background:rgba(255,255,255,.1)}
.tbtn.on{background:rgba(255,255,255,.14);border-color:rgba(255,255,255,.35)}
/* 音效下拉選單 */
.menuWrap{position:relative}
.menu{position:absolute;right:0;top:calc(100% + 8px);min-width:196px;z-index:90;display:none;
  background:#0c0f1c;border:1px solid rgba(255,255,255,.16);border-radius:14px;padding:6px;
  box-shadow:0 22px 54px rgba(0,0,0,.72)}
.menu.show{display:block}
.mrow{display:flex;align-items:center;width:100%;gap:12px;padding:10px 12px;border-radius:10px;
  font-size:12px;letter-spacing:.08em;color:var(--dim);text-align:left}
.mrow span{flex:1;white-space:nowrap}
.mrow em{font-style:normal;font-size:10px;font-weight:900;letter-spacing:.1em;
  padding:3px 9px;border-radius:999px;border:1px solid var(--line);color:var(--dim)}
.mrow:hover{background:rgba(255,255,255,.08);color:var(--txt)}
.mrow.on{color:var(--txt)}
.mrow.on em{color:#04060f;background:linear-gradient(90deg,var(--a1),var(--b1));border-color:transparent}

/* ---------- board ---------- */
.board{display:grid;grid-template-columns:1fr 210px 1fr;align-items:center;align-content:center;
  gap:6px;padding:10px 12px;max-width:1500px;margin:0 auto;width:100%;
  flex:1 0 auto}
.side{display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0}
/* 隊名：整個框就是一顆按鈕，點下去才換成輸入框 —— 沒有任何死角 */
.hide{display:none!important}
.tbox{width:100%;max-width:390px;position:relative;z-index:3}
.tnameBtn,.tname{
  display:block;box-sizing:border-box;width:100%;margin:0;
  background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.16);border-radius:14px;
  padding:15px 16px;text-align:center;font-family:inherit;font-size:16px;font-weight:800;
  letter-spacing:.26em;color:var(--dim);outline:none;transition:.15s;
  -webkit-appearance:none;appearance:none;-webkit-tap-highlight-color:transparent}
.tnameBtn{cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tnameBtn:hover,.tnameBtn:focus-visible{color:var(--txt);background:rgba(255,255,255,.08);
  border-color:rgba(255,255,255,.45)}
.A .tnameBtn:hover,.A .tnameBtn:focus-visible{border-color:var(--a1);box-shadow:0 0 0 3px rgba(224,31,45,.14)}
.B .tnameBtn:hover,.B .tnameBtn:focus-visible{border-color:var(--b1);box-shadow:0 0 0 3px rgba(27,95,214,.16)}
.tname{cursor:text;letter-spacing:.14em;color:var(--txt);background:rgba(255,255,255,.09)}
.A .tname{border-color:var(--a1);box-shadow:0 0 0 3px rgba(224,31,45,.14)}
.B .tname{border-color:var(--b1);box-shadow:0 0 0 3px rgba(27,95,214,.16)}
.tname::placeholder{color:#4a4d61;letter-spacing:.1em}
.score{
  font-size:clamp(120px,min(30vw,40vh),440px);line-height:.86;font-weight:900;font-variant-numeric:tabular-nums;
  -webkit-text-stroke:3px transparent;background-clip:text;-webkit-background-clip:text;color:transparent;
  filter:drop-shadow(0 0 22px rgba(224,31,45,.35));user-select:none;transition:transform .12s;
  /* 行高 .86 讓字形溢出自己的框，會蓋住上方的隊名按鈕 —— 分數純顯示，不吃點擊 */
  pointer-events:none
}
/* 白鉻裝甲罩在彩色核心上 —— 模仿海報那兩顆的質感 */
.A .score{background-image:linear-gradient(176deg,
    #fff 0%,var(--chrome) 12%,var(--a3) 19%,var(--a2) 35%,var(--a1) 62%,var(--aDeep) 100%);
  filter:drop-shadow(0 1px 0 rgba(255,255,255,.25)) drop-shadow(0 0 12px rgba(255,106,43,.38))
         drop-shadow(0 0 46px var(--aSoft))}
.B .score{background-image:linear-gradient(176deg,
    #fff 0%,var(--chrome) 12%,var(--b3) 19%,var(--b2) 35%,var(--b1) 62%,var(--bDeep) 100%);
  filter:drop-shadow(0 1px 0 rgba(255,255,255,.25)) drop-shadow(0 0 12px rgba(63,208,240,.38))
         drop-shadow(0 0 46px var(--bSoft))}
.score.bump{transform:scale(1.09)}
.combos{display:flex;flex-direction:column;gap:3px;align-items:center;width:100%;min-height:18px;padding:2px 4px;
  position:relative;z-index:2}
.cline{display:flex;align-items:center;gap:6px;font-size:12px;letter-spacing:.03em;max-width:100%}
.cline .num{font-size:9px;font-weight:900;width:15px;height:15px;flex:none;border-radius:5px;
  display:grid;place-items:center;background:rgba(255,255,255,.12);color:var(--dim)}
.A .cline .num{background:rgba(224,31,45,.28);color:#ffd8cc}
.B .cline .num{background:rgba(27,95,214,.32);color:#cfe9ff}
.cline .txt{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cline .tp{font-size:9px;color:var(--dim);flex:none}
/* 本回合上場的那顆 */
.cline{cursor:pointer;border:1px solid transparent;border-radius:999px;padding:3px 11px 3px 4px;font-size:13px;
  opacity:.42;transition:.15s}
.cline:hover{opacity:.8}
.cline.on{opacity:1;background:rgba(255,255,255,.07)}
.A .cline.on{border-color:rgba(224,31,45,.55);box-shadow:0 0 16px rgba(224,31,45,.18)}
.B .cline.on{border-color:rgba(27,95,214,.6);box-shadow:0 0 16px rgba(27,95,214,.2)}
.combos.single .cline{opacity:1;cursor:default;border-color:transparent!important;background:none;box-shadow:none}

/* finish buttons */
.fins{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;width:100%;max-width:390px;margin-top:8px}
.fin{border:1px solid var(--line);border-radius:14px;padding:12px 8px;background:rgba(255,255,255,.04);
  display:flex;flex-direction:column;align-items:center;gap:2px;transition:.15s}
.fin:active{transform:scale(.96)}
.fin b{font-size:15px;font-weight:800;letter-spacing:.04em}
.fin i{font-style:normal;font-size:11px;color:var(--dim)}
.A .fin{border-color:rgba(224,31,45,.34)}
.B .fin{border-color:rgba(27,95,214,.4)}
.A .fin:hover{transform:translateY(-1px);border-color:var(--a1);
  background:linear-gradient(180deg,rgba(224,31,45,.20),rgba(255,106,43,.13));
  box-shadow:0 0 0 1px rgba(224,31,45,.35),0 8px 26px -8px var(--aGlow)}
.B .fin:hover{transform:translateY(-1px);border-color:var(--b2);
  background:linear-gradient(180deg,rgba(63,208,240,.18),rgba(27,95,214,.16));
  box-shadow:0 0 0 1px rgba(63,208,240,.35),0 8px 26px -8px var(--bGlow)}
.adj{display:flex;gap:8px;width:100%;max-width:390px;margin-top:6px}
.adj button{flex:1;border:1px solid var(--line);border-radius:10px;padding:7px;font-size:14px;font-weight:700;
  background:rgba(255,255,255,.03);color:var(--dim)}
.adj button:hover{color:var(--txt);background:rgba(255,255,255,.09)}

/* ---------- center ---------- */
.center{display:flex;flex-direction:column;align-items:center;gap:14px}
.go{width:106px;height:106px;border-radius:50%;border:2px solid rgba(255,255,255,.22);
  background:rgba(255,255,255,.04);display:grid;place-items:center;position:relative;transition:.2s;
  margin-bottom:16px;flex:none}
.go:hover{border-color:#fff;background:rgba(255,255,255,.1);
  box-shadow:0 0 0 6px rgba(255,255,255,.05),-14px 0 44px -6px var(--aGlow),14px 0 44px -6px var(--bGlow)}
.go svg{width:31px;height:31px;fill:currentColor;margin-left:3px}
.go span{position:absolute;bottom:-20px;font-size:10px;letter-spacing:.22em;color:var(--dim)}
.rst{border:1px solid var(--line);border-radius:999px;padding:8px 16px;font-size:11px;
  letter-spacing:.18em;color:var(--dim);background:rgba(255,255,255,.03)}
.rst:hover{color:var(--txt);border-color:rgba(255,255,255,.4)}
.tofirst{font-size:10px;letter-spacing:.14em;color:var(--dim);display:flex;align-items:center;gap:6px}
.tofirst select{background:#12121b;color:var(--txt);border:1px solid var(--line);border-radius:8px;
  padding:3px 6px;font-size:11px;font-family:inherit}

/* ---------- countdown overlay ---------- */
.cd{position:fixed;inset:0;z-index:60;display:none;place-items:center;
  background:rgba(4,4,9,.86);backdrop-filter:blur(10px)}
.cd.show{display:grid}
.cd .n{font-size:clamp(120px,34vw,340px);font-weight:900;line-height:1;
  background-image:linear-gradient(176deg,#fff 0%,var(--chrome) 14%,#9fb4d8 46%,#3d5580 100%);
  background-clip:text;-webkit-background-clip:text;color:transparent;
  filter:drop-shadow(0 0 14px rgba(46,230,200,.45)) drop-shadow(0 0 60px rgba(63,208,240,.35));
  animation:pop .55s cubic-bezier(.2,1.3,.4,1)}
.cd .n.word{font-size:clamp(46px,12vw,140px);letter-spacing:.06em;
  background-image:linear-gradient(176deg,#fff 0%,var(--a3) 22%,var(--a2) 52%,var(--a1) 100%);
  filter:drop-shadow(0 0 16px rgba(255,106,43,.55)) drop-shadow(0 0 66px var(--aGlow))}
@keyframes pop{0%{transform:scale(.45);opacity:0}45%{transform:scale(1.12);opacity:1}100%{transform:scale(1)}}

/* ---------- winner ---------- */
.win{position:fixed;inset:0;z-index:70;display:none;place-items:center;background:rgba(4,4,9,.9);backdrop-filter:blur(12px)}
.win.show{display:grid}
.win .box{text-align:center;animation:pop .5s cubic-bezier(.2,1.3,.4,1)}
.win h2{margin:0;font-size:clamp(38px,9vw,96px);font-weight:900;letter-spacing:.04em;
  background-image:linear-gradient(180deg,#fff,#c8d2ff);background-clip:text;-webkit-background-clip:text;color:transparent}
.win.wa h2{background-image:linear-gradient(178deg,#fff,var(--a3) 26%,var(--a1) 62%,var(--a2));
  filter:drop-shadow(0 0 40px var(--aGlow))}
.win.wb h2{background-image:linear-gradient(178deg,#fff,var(--b3) 26%,var(--b2) 62%,var(--b1));
  filter:drop-shadow(0 0 40px var(--bGlow))}
.win.wa .acts button.pri{background:linear-gradient(90deg,var(--a1),var(--a2))}
.win.wb .acts button.pri{background:linear-gradient(90deg,var(--b1),var(--b2))}
.win p{color:var(--dim);letter-spacing:.24em;font-size:12px;margin:6px 0 22px}
.win .acts{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.win .acts button{border:1px solid var(--line);border-radius:999px;padding:11px 22px;font-size:12px;letter-spacing:.14em;background:rgba(255,255,255,.05)}
.win .acts button:hover{background:rgba(255,255,255,.14)}
.win .acts button.pri{background:linear-gradient(90deg,var(--a1),var(--b1));border-color:transparent;font-weight:800}
.win .acts button.pri:hover{filter:brightness(1.15)}
.win .acts button[disabled]{opacity:.5;cursor:progress}
.shareHint{min-height:16px;margin:14px 0 0;font-size:11px;color:var(--dim);letter-spacing:.08em}

/* ---------- config ---------- */
.cfg{max-width:1400px;margin:0 auto;padding:24px 12px 40px;display:none;width:100%;flex:none;
  border-top:1px solid var(--line);background:rgba(0,0,0,.25)}
.cfg.show{display:block}
.cfgGrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.card{border:1px solid var(--line);border-radius:16px;background:var(--panel);padding:14px}
.card.A{border-color:rgba(224,31,45,.28)}
.card.B{border-color:rgba(27,95,214,.32)}
.card h3{margin:0 0 12px;font-size:12px;letter-spacing:.24em;color:var(--dim);font-weight:800}
.bey{border:1px solid var(--line);border-radius:13px;padding:12px;margin-bottom:10px;background:rgba(0,0,0,.25)}
.beyHead{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.beyHead .no{font-size:10px;font-weight:900;letter-spacing:.18em;color:var(--dim)}
.beyHead .sp{flex:1}
.beyHead .del{font-size:11px;color:var(--dim);border:1px solid var(--line);border-radius:999px;padding:3px 10px}
.beyHead .del:hover{color:#ff5f72;border-color:rgba(224,31,45,.6)}
/* 確認後的零件照片橫列 */
.beyHead .edit{font-size:11px;color:var(--dim);border:1px solid var(--line);border-radius:999px;padding:3px 10px}
.beyHead .edit:hover{color:var(--txt);border-color:rgba(255,255,255,.5)}
.okBtn{width:100%;border:1px solid transparent;border-radius:12px;padding:11px;font-size:12px;
  letter-spacing:.18em;font-weight:800;color:#04060f;background:linear-gradient(90deg,var(--a1),var(--b1));
  transition:.15s}
.okBtn:hover{filter:brightness(1.12)}
.okBtn[disabled]{opacity:.34;cursor:not-allowed;background:rgba(255,255,255,.06);
  color:var(--dim);border-color:var(--line);filter:none}
.strip{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:2px 0 12px}
.cell{display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0;text-align:center}
.cell .ph{width:100%;aspect-ratio:1;border-radius:12px;border:1px solid var(--line);
  background:radial-gradient(70% 70% at 50% 40%,rgba(255,255,255,.07),rgba(255,255,255,.02));
  display:grid;place-items:center;overflow:hidden;padding:6px}
.cell .ph img{width:100%;height:100%;object-fit:contain;display:block}
.cell .ph.empty{border-style:dashed;background:none}
.cell .ph .fb{font-size:10px;color:var(--dim);line-height:1.5;letter-spacing:.06em;word-break:break-all}
.A .cell .ph{border-color:rgba(224,31,45,.28)}
.B .cell .ph{border-color:rgba(27,95,214,.32)}
.cell b{font-size:12px;font-weight:800;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cell .slot{font-size:9px;letter-spacing:.16em;color:var(--dim)}
.cell.off b{color:var(--dim);font-weight:500}
.official{border-top:1px dashed var(--line);padding-top:11px;font-size:16px;font-weight:800;letter-spacing:.02em}
.official .tags{margin-top:6px}
.official small{display:block;font-size:10px;color:var(--dim);letter-spacing:.14em;margin-top:5px;font-weight:500}
.addBey{width:100%;border:1px dashed rgba(255,255,255,.24);border-radius:12px;padding:10px;
  font-size:12px;letter-spacing:.12em;color:var(--dim);background:rgba(255,255,255,.02)}
.addBey:hover{color:var(--txt);border-color:rgba(255,255,255,.5);background:rgba(255,255,255,.06)}
.addBey[disabled]{opacity:.32;cursor:not-allowed}
.row{margin-bottom:10px}
.row>label{display:block;font-size:10px;letter-spacing:.16em;color:var(--dim);margin-bottom:4px}
.cb{position:relative}
.cb input{width:100%;background:#101018;border:1px solid var(--line);border-radius:10px;
  padding:9px 34px 9px 11px;color:var(--txt);font-size:13px;font-family:inherit;outline:none}
.cb input:focus{border-color:rgba(255,255,255,.42)}
.cb .clr{position:absolute;right:8px;top:50%;transform:translateY(-50%);color:var(--dim);font-size:15px;padding:2px 6px;border-radius:6px}
.cb .clr:hover{color:#fff}
.list{position:absolute;z-index:20;left:0;right:0;top:calc(100% + 4px);max-height:260px;overflow:auto;
  background:#0d0d15;border:1px solid rgba(255,255,255,.16);border-radius:12px;display:none;
  box-shadow:0 20px 50px rgba(0,0,0,.7)}
.list.show{display:block}
.opt{display:flex;align-items:center;gap:8px;padding:8px 11px;font-size:13px;cursor:pointer}
.opt:hover,.opt.hi{background:rgba(255,255,255,.09)}
.tier{font-size:10px;font-weight:900;min-width:26px;text-align:center;padding:2px 4px;border-radius:5px;color:#08080d}
.t-X{background:#fde047}.t-Sp{background:#fb7185}.t-S{background:#f97316}
.t-Ap{background:#a3e635}.t-A{background:#4ade80}.t-Bp{background:#34d399}.t-B{background:#22d3ee}
.t-Cp{background:#60a5fa}.t-C{background:#818cf8}.t-Dp{background:#c084fc}.t-D{background:#e879f9}
.t-Ep{background:#94a3b8}.t-E{background:#64748b;color:#fff}.t-n{background:#3f3f52;color:#c9cbe0}
.ty{font-size:10px;color:var(--dim);margin-left:auto;white-space:nowrap}
.summary{margin-top:12px;border-top:1px dashed var(--line);padding-top:14px;margin-bottom:14px;
  font-size:14px;font-weight:700;letter-spacing:.03em;min-height:20px}
.summary small{display:block;font-weight:500;font-size:11px;color:var(--dim);letter-spacing:.1em;margin-top:3px}



/* ---------- 戰報 / 統計 ---------- */
.ltabs{display:flex;align-items:center;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.ltabs .sp{flex:1}
.ltab{border:1px solid var(--line);border-radius:999px;padding:7px 16px;font-size:12px;
  letter-spacing:.1em;background:rgba(255,255,255,.03);color:var(--dim)}
.ltab.on{color:var(--txt);background:rgba(255,255,255,.13);border-color:rgba(255,255,255,.35)}
.lact{border:1px solid var(--line);border-radius:999px;padding:7px 14px;font-size:11px;
  letter-spacing:.06em;color:var(--dim)}
.lact:hover{color:var(--txt);border-color:rgba(255,255,255,.45)}
#diag{position:fixed;left:8px;right:8px;bottom:8px;z-index:200;display:none;
  background:rgba(0,0,0,.88);border:1px solid #3af;border-radius:12px;padding:10px 12px;
  font:11px/1.55 ui-monospace,Menlo,monospace;color:#9fe;white-space:pre-wrap;word-break:break-all}
#diag.show{display:block}
#diagEdge{position:fixed;left:0;right:0;bottom:0;height:2px;background:#0f0;z-index:199;display:none}
#diagEdge.show{display:block}
.empty{color:var(--dim);font-size:12px;padding:28px 0;text-align:center;letter-spacing:.08em}

.rnd{display:grid;grid-template-columns:34px 1fr 96px 1fr;align-items:center;gap:10px;
  border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:7px;
  background:rgba(255,255,255,.03);font-size:12px}
.rnd .rn{font-size:10px;font-weight:900;color:var(--dim);letter-spacing:.06em}
.rnd .sd{display:flex;flex-direction:column;gap:2px;min-width:0}
.rnd .sd b{font-size:12px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rnd .sd small{font-size:9px;color:var(--dim);letter-spacing:.08em}
.rnd .sd.r{text-align:right;align-items:flex-end}
.rnd .sd.lose b{color:var(--dim);font-weight:500}
.rnd .fx{text-align:center}
.rnd .fx b{display:block;font-size:11px;font-weight:800;letter-spacing:.04em}
.rnd .fx small{font-size:9px;color:var(--dim)}
.rnd.wa{border-color:rgba(224,31,45,.4)}
.rnd.wb{border-color:rgba(27,95,214,.45)}

.stat{margin-bottom:26px}
.stat h4{margin:0 0 10px;font-size:11px;letter-spacing:.22em;color:var(--dim);font-weight:800}
table.st{width:100%;border-collapse:collapse;font-size:12px}
table.st th{font-size:10px;letter-spacing:.1em;color:var(--dim);font-weight:600;text-align:right;
  padding:6px 8px;border-bottom:1px solid var(--line)}
table.st th:first-child{text-align:left}
table.st td{padding:8px;border-bottom:1px solid rgba(255,255,255,.05);text-align:right;
  font-variant-numeric:tabular-nums}
table.st td:first-child{text-align:left;overflow:hidden;text-overflow:ellipsis;max-width:0;white-space:nowrap}
table.st tr:hover td{background:rgba(255,255,255,.03)}
.wr{display:inline-flex;align-items:center;gap:7px;justify-content:flex-end}
.wr .bar{width:56px;height:5px;border-radius:3px;background:rgba(255,255,255,.1);overflow:hidden;flex:none}
.wr .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--a1),var(--b1))}
.statNote{font-size:10px;color:#5b5f75;letter-spacing:.06em;margin:-4px 0 14px}

/* ---------- 音效設定面板 ---------- */
.sheetWrap{position:fixed;inset:0;z-index:80;display:none;place-items:center;background:rgba(4,4,9,.72);backdrop-filter:blur(6px);padding:16px}
.sheetWrap.show{display:grid}
.sheet{width:100%;max-width:440px;border:1px solid rgba(255,255,255,.16);border-radius:18px;
  background:#0d0d15;padding:20px;box-shadow:0 30px 80px rgba(0,0,0,.8)}
.sheet h3{margin:0 0 4px;font-size:13px;letter-spacing:.2em;font-weight:800}
.sheet .hint{font-size:11px;color:var(--dim);line-height:1.7;margin:0 0 16px}
.vlist{display:flex;flex-direction:column;gap:6px;margin-bottom:10px}
.vrow{display:flex;align-items:center;gap:10px;width:100%;padding:11px 12px;border-radius:12px;
  border:1px solid var(--line);background:rgba(255,255,255,.03);text-align:left;transition:.15s}
.vrow:hover{background:rgba(255,255,255,.08)}
.vrow .dot{width:16px;height:16px;border-radius:50%;border:2px solid var(--line);flex:none}
.vrow.on{border-color:var(--a1);background:rgba(224,31,45,.10)}
.vrow.on .dot{border-color:var(--a1);background:var(--a1);box-shadow:inset 0 0 0 3px #04060f}
.vrow b{font-size:13px;font-weight:700;display:block}
.vrow small{font-size:10px;color:var(--dim);letter-spacing:.06em}
.vrow .txt{flex:1;min-width:0}
.vrow .del{font-size:11px;color:var(--dim);border:1px solid var(--line);border-radius:999px;padding:3px 9px;flex:none}
.cueHead{font-size:10px;letter-spacing:.16em;color:var(--dim);margin:16px 0 7px}
.cueGrid{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-bottom:12px}
.cueGrid label{display:flex;flex-direction:column;gap:4px;font-size:10px;letter-spacing:.1em;color:var(--dim);text-align:center}
.cueGrid input{width:100%;background:#15151f;border:1px solid var(--line);border-radius:9px;
  padding:8px 4px;color:var(--txt);font-size:13px;font-family:inherit;text-align:center}
.fileBox{border:1px dashed rgba(255,255,255,.22);border-radius:12px;padding:14px;text-align:center;margin-bottom:14px}
.fileBox .fname{font-size:13px;font-weight:700;margin-bottom:2px;word-break:break-all}
.fileBox .fmeta{font-size:10px;color:var(--dim);letter-spacing:.1em}
.sbtn{border:1px solid var(--line);border-radius:999px;padding:8px 16px;font-size:12px;
  letter-spacing:.06em;background:rgba(255,255,255,.05);margin:4px 3px 0}
.sbtn:hover{background:rgba(255,255,255,.14)}
.sbtn.pri{background:linear-gradient(90deg,var(--a1),var(--b1));border-color:transparent;font-weight:700}
.numRow{display:flex;align-items:center;gap:10px;margin-bottom:10px;font-size:12px}
.numRow label{flex:1;color:var(--dim);letter-spacing:.08em}
.numRow input{width:82px;background:#15151f;border:1px solid var(--line);border-radius:9px;
  padding:7px 9px;color:var(--txt);font-size:13px;font-family:inherit;text-align:right}
.cueBar{display:flex;gap:4px;margin:6px 0 16px;font-size:10px;color:var(--dim);letter-spacing:.08em}
.cueBar span{flex:1;text-align:center;padding:5px 0;border:1px solid var(--line);border-radius:7px;background:rgba(255,255,255,.03)}
.sheet .close{display:block;width:100%;margin-top:16px;border:1px solid var(--line);border-radius:12px;padding:11px;font-size:12px;letter-spacing:.18em}
.sheet .close:hover{background:rgba(255,255,255,.1)}
.src{max-width:1400px;margin:0 auto;padding:14px 12px 20px;font-size:10px;color:#5b5f75;
  letter-spacing:.06em;text-align:center;flex:none}
.src a{color:#7c8098}

@media (max-width:760px){
  /* 頂列：標題自己一行，四顆按鈕縮小排第二行 —— 不再撐破畫面 */
  .top{gap:6px;padding-top:calc(6px + env(safe-area-inset-top));padding-bottom:8px}
  .brand{width:100%;font-size:10px;letter-spacing:.2em;margin-bottom:2px}
  .tbtn{padding:6px 11px;font-size:11px;letter-spacing:.02em}
  .board{padding-left:calc(5px + env(safe-area-inset-left));
         padding-right:calc(5px + env(safe-area-inset-right))}
  .cfg,.src{padding-bottom:calc(20px + env(safe-area-inset-bottom))}
  .menu{min-width:170px}
  .rnd{grid-template-columns:26px 1fr 74px 1fr;gap:6px;padding:9px 8px;font-size:11px}
  .rnd .sd b{font-size:11px}
  table.st{font-size:11px}
  .wr .bar{width:38px}
  .board{grid-template-columns:1fr 92px 1fr;gap:2px;padding:8px 5px}
  .score{font-size:clamp(90px,29vw,180px)}
  .tbox{max-width:100%}
  .tnameBtn,.tname{font-size:12px;letter-spacing:.16em;padding:11px 6px}
  .center{gap:10px}
  .go{width:58px;height:58px;margin-bottom:14px}.go svg{width:18px;height:18px}
  .fins{grid-template-columns:1fr 1fr;gap:4px}
  .fin{padding:7px 4px;border-radius:10px}.fin b{font-size:11px}.fin i{font-size:9px}
  .cline{font-size:10px}.cline .tp{display:none}
  .cfgGrid{grid-template-columns:1fr}
}
/* =====================================================================
   手機橫屏：專注模式 —— 只留隊名、分數、四顆 Finish、START / RESET
   ±1 收成分數兩側的小圓鈕，按錯還救得回來
   ===================================================================== */
.scoreRow{display:contents}
.miniAdj{display:none}
@media (orientation:landscape) and (max-height:560px){
  .top{padding-top:calc(4px + env(safe-area-inset-top));padding-bottom:4px;gap:5px}
  .brand{display:none}
  .tbtn{padding:5px 10px;font-size:10px}
  .board{grid-template-columns:1fr 150px 1fr;gap:6px;padding:2px 6px 4px;
         padding-left:calc(16px + env(safe-area-inset-left));
         padding-right:calc(16px + env(safe-area-inset-right))}
  .side{gap:2px}
  /* 隱藏：陀螺清單、原本那排 ±1、頁尾、設定面板 */
  .combos,.adj,.src{display:none!important}
  .cfg{display:none!important}

  .tbox{max-width:100%}
  .tnameBtn,.tname{padding:9px 10px;font-size:14px;letter-spacing:.16em;border-radius:12px}

  /* 分數與 ±1 小圓鈕同一列 */
  .scoreRow{display:flex;align-items:center;justify-content:center;gap:8px;width:100%}
  .score{font-size:min(38vh,19vw);line-height:.88;flex:none}
  .miniAdj{display:flex;flex-direction:column-reverse;gap:6px;flex:none;order:2}
  .A .scoreRow .miniAdj{order:-1}
  .miniAdj button{width:42px;height:42px;border-radius:50%;border:1px solid var(--line);
    background:rgba(255,255,255,.05);font-size:18px;font-weight:800;color:var(--dim);line-height:1}
  .miniAdj button:active{transform:scale(.92)}
  .A .miniAdj button{border-color:rgba(224,31,45,.4)}
  .B .miniAdj button{border-color:rgba(27,95,214,.45)}

  .fins{grid-template-columns:repeat(2,1fr);gap:6px;margin-top:6px;max-width:100%}
  .fin{padding:10px 6px;border-radius:12px}
  .fin b{font-size:15px}.fin i{font-size:10px}
  .center{gap:6px}
  .go{width:74px;height:74px;margin-bottom:14px}
  .go svg{width:23px;height:23px}
  .go span{bottom:-16px;font-size:9px}
  .tofirst{font-size:10px;gap:5px}
  .rst{padding:7px 15px;font-size:11px;letter-spacing:.12em}
}
</style>
</head>
<body>

<div class="top">
  <div class="brand">BEYBLADE&nbsp;X&nbsp;·&nbsp;SCORER</div>
  <div class="sp"></div>
  <button class="tbtn" id="btnCfg">陀螺配置</button>
  <button class="tbtn" id="btnLog">戰報</button>
  <button class="tbtn" id="btnAudio">🎙 倒數錄音</button>
  <div class="menuWrap">
    <button class="tbtn" id="btnSound" aria-expanded="false">🔊 音效 ▾</button>
    <div class="menu" id="soundMenu">
      <button class="mrow" data-k="cd"><span>倒數音效</span><em>ON</em></button>
      <button class="mrow" data-k="fx"><span>計分音效</span><em>ON</em></button>
      <button class="mrow" data-k="win"><span>獲勝音效</span><em>ON</em></button>
    </div>
  </div>
</div>

<div class="scroll">
<div class="board">
  <!-- A -->
  <div class="side A">
    <div class="tbox">
      <button type="button" class="tnameBtn" id="nameBtnA" title="點一下改成自己的隊名">TEAM A</button>
      <input class="tname hide" id="nameA" value="TEAM A" spellcheck="false" maxlength="18" placeholder="輸入隊名">
    </div>
    <div class="scoreRow">
      <div class="score" id="scoreA">0</div>
      <div class="miniAdj" data-side="A"><button data-d="-1" title="減 1 分">−</button><button data-d="1" title="加 1 分">＋</button></div>
    </div>
    <div class="combos" id="comboA"></div>
    <div class="fins" data-side="A">
      <button class="fin" data-p="1" data-f="spin"><b>Spin</b><i>回轉勝 +1</i></button>
      <button class="fin" data-p="2" data-f="burst"><b>Burst</b><i>爆裂勝 +2</i></button>
      <button class="fin" data-p="2" data-f="over"><b>Over</b><i>場外勝 +2</i></button>
      <button class="fin" data-p="3" data-f="xtreme"><b>Xtreme</b><i>極限勝 +3</i></button>
    </div>
    <div class="adj" data-side="A"><button data-d="-1">− 1</button><button data-d="1">+ 1</button></div>
  </div>

  <!-- center -->
  <div class="center">
    <button class="go" id="btnGo" title="開始倒數">
      <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
      <span>START</span>
    </button>
    <div class="tofirst">先到
      <select id="target"><option>3</option><option selected>4</option><option>5</option><option>7</option><option value="0">∞</option></select>
      分
    </div>
    <button class="rst" id="btnReset">RESET</button>
  </div>

  <!-- B -->
  <div class="side B">
    <div class="tbox">
      <button type="button" class="tnameBtn" id="nameBtnB" title="點一下改成自己的隊名">TEAM B</button>
      <input class="tname hide" id="nameB" value="TEAM B" spellcheck="false" maxlength="18" placeholder="輸入隊名">
    </div>
    <div class="scoreRow">
      <div class="score" id="scoreB">0</div>
      <div class="miniAdj" data-side="B"><button data-d="-1" title="減 1 分">−</button><button data-d="1" title="加 1 分">＋</button></div>
    </div>
    <div class="combos" id="comboB"></div>
    <div class="fins" data-side="B">
      <button class="fin" data-p="1" data-f="spin"><b>Spin</b><i>回轉勝 +1</i></button>
      <button class="fin" data-p="2" data-f="burst"><b>Burst</b><i>爆裂勝 +2</i></button>
      <button class="fin" data-p="2" data-f="over"><b>Over</b><i>場外勝 +2</i></button>
      <button class="fin" data-p="3" data-f="xtreme"><b>Xtreme</b><i>極限勝 +3</i></button>
    </div>
    <div class="adj" data-side="B"><button data-d="-1">− 1</button><button data-d="1">+ 1</button></div>
  </div>
</div>

<div class="cfg" id="cfg">
  <div class="cfgGrid">
    <div class="card A" id="cardA"></div>
    <div class="card B" id="cardB"></div>
  </div>
</div>

<div class="cfg" id="log">
  <div class="ltabs">
    <button class="ltab on" data-t="rounds">本場回合</button>
    <button class="ltab" data-t="stats">累積統計</button>
    <span class="sp"></span>
    <button class="lact" id="undoRound">撤銷上一回合</button>
    <button class="lact" id="clearStats">清除累積統計</button>
  </div>
  <div id="logBody"></div>
</div>

<div class="src">零件資料、天梯與零件照片整理自 <a href="https://stan-yao.github.io/beyblade_x_tier/" target="_blank" rel="noreferrer">Beyblade X Tier 台灣天梯情報站</a>｜計分規則依 TAKARA TOMY《BEYBLADE X REGULATION》</div>
</div>

  <div class="sheet">
    <h3>倒數錄音</h3>
    <p class="hint">選一個倒數的聲音。想用自己的就按下面匯入，會存在這台裝置裡。</p>

    <div class="vlist" id="vlist"></div>
    <button class="sbtn" id="afPick">＋ 匯入我的錄音</button>

      <label>3<input type="number" id="c0" step="0.02" min="0" max="20"></label>
      <label>2<input type="number" id="c1" step="0.02" min="0" max="20"></label>
      <label>1<input type="number" id="c2" step="0.02" min="0" max="20"></label>
      <label>GO<input type="number" id="c3" step="0.02" min="0" max="20"></label>

    <p class="hint" style="margin:10px 0 0">按試聽對一下，數字會在上面這幾個時間點跳出來。</p>

  </div>

<div id="diagEdge"></div>
<div id="diag"></div>

      <button id="winShare" class="pri">分享戰績</button>
      <button id="winNext">下一場</button>
      <button id="winClose">繼續加分</button>

/* =======================================================================

const IMG_COMMON=['transparent-Photoroom.webp','image.webp','image.png','transparent-Photoroom.png'];
const IMG_PRE={r:'RC-PRD-',b:'BT-PRD-',a:'AB-PRD-',l:'BL-PRD-'};
function decTail(t){
  if(/^[0-3]$/.test(t)) return IMG_COMMON[+t];
  const ext=t.slice(-1)==='p'?'.png':'.webp', body=t.slice(0,-1);
  if(body.charAt(0)==='!') return body.slice(1)+ext;
  const p=IMG_PRE[body.charAt(0)];
  return p? p+body.slice(1)+ext : body+ext;
}

IMG_RAW.split(',').forEach(s=>{const p=s.split('~');
  if(p.length===3) IMG[p[0]]='https://i.ibb.co/'+p[1]+'/'+decTail(p[2]);});
const partImg=n=>n?(IMG[n]||''):'';

/* =======================================================================
   音效（Web Audio + 語音合成，不需外部檔案）
   ======================================================================= */
let ac=null;
/* 三個獨立的音效頻道：cd 倒數、fx 計分、win 獲勝 */
const SFX={cd:true,fx:true,win:true};
try{ Object.assign(SFX,JSON.parse(localStorage.getItem('beyx_sfx')||'{}')); }catch(e){}
const saveSFX=()=>{ try{localStorage.setItem('beyx_sfx',JSON.stringify(SFX));}catch(e){} };
// 舊版只有一顆「計分音效」開關，沿用它的設定
try{ if(localStorage.getItem('beyx_hit')==='0'){ SFX.fx=false; localStorage.removeItem('beyx_hit'); saveSFX(); } }catch(e){}
function ensureAudio(){ if(!ac){ac=new (window.AudioContext||window.webkitAudioContext)();} if(ac.state==='suspended')ac.resume(); }
function beep(freq,dur,vol,type,ch){
  if(!SFX[ch||'fx'])return; ensureAudio();
  const o=ac.createOscillator(), g=ac.createGain();
  o.type=type||'square'; o.frequency.value=freq;
  g.gain.setValueAtTime(0.0001,ac.currentTime);
  g.gain.exponentialRampToValueAtTime(vol,ac.currentTime+.012);
  g.gain.exponentialRampToValueAtTime(0.0001,ac.currentTime+dur);
  o.connect(g).connect(ac.destination); o.start(); o.stop(ac.currentTime+dur+.05);
}
function sweep(){
  if(!SFX.cd)return; ensureAudio();
  const o=ac.createOscillator(), g=ac.createGain();
  o.type='sawtooth';
  o.frequency.setValueAtTime(300,ac.currentTime);
  o.frequency.exponentialRampToValueAtTime(1400,ac.currentTime+.35);
  g.gain.setValueAtTime(.28,ac.currentTime);
  g.gain.exponentialRampToValueAtTime(.0001,ac.currentTime+.6);
  o.connect(g).connect(ac.destination); o.start(); o.stop(ac.currentTime+.65);
}
function say(txt){
  if(!SFX.cd||!window.speechSynthesis)return;
  try{ const u=new SpeechSynthesisUtterance(txt); u.lang='en-US'; u.rate=1.05; u.pitch=1.1; u.volume=1;
       speechSynthesis.cancel(); speechSynthesis.speak(u); }catch(e){}

function makeClip(b64,mime){
  if(!b64||b64.charAt(0)==='@')return null;
  try{
    const bin=atob(b64), u=new Uint8Array(bin.length);
    for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);
    const url=URL.createObjectURL(new Blob([u],{type:mime||'audio/mp4'}));
    const pre=new Audio(url); pre.preload='auto';   // 先讓瀏覽器解好，按下去才不會延遲
    return url;
  }catch(e){ return null; }
}
const hitURL=makeClip(HIT_B64), scoreURL=makeClip(SCORE_B64);
function playClip(url,vol){
  if(!url)return;
  try{ const a=new Audio(url); a.volume=vol==null?1:vol; a.play().catch(()=>{}); }catch(e){}
}
// 加分（Finish 四顆 + 加 1）用第二組音效，受「計分音效」開關控制，音量壓低當背景提示
function scoreFx(){ if(SFX.fx) playClip(scoreURL,0.42); }
// 獲勝畫面用第一組音效，滿音量、一律播放
function winFx(){ if(SFX.win) playClip(hitURL,1); }

/* =======================================================================
   計分
   ======================================================================= */
const S={A:0,B:0};
const el=id=>document.getElementById(id);
const scoreEl={A:el('scoreA'),B:el('scoreB')};
let target=4, locked=false, winShown=false;

function render(only){
  (only?[only]:['A','B']).forEach(k=>{
    scoreEl[k].textContent=String(S[k]);
    scoreEl[k].classList.add('bump');
    setTimeout(()=>scoreEl[k].classList.remove('bump'),130);
  });
}
function add(side,pts,quiet){
  if(locked)return;
  // 這一分就直接分出勝負的話，只播獲勝音效 —— 否則加分音會蓋掉它
  const willWin = !!target && !winShown && pts>0 && (S[side]+pts)>=target;
  S[side]=Math.max(0,S[side]+pts);
  render(side);
  if(!quiet && !willWin){ if(pts>0) scoreFx(); else beep(300,.08,.14,'sine'); }
  checkWin();
}
function checkWin(){
  if(!target||winShown)return;
  ['A','B'].forEach(k=>{
    if(S[k]>=target && !locked){
      locked=true; winShown=true;
      el('winName').textContent=(k==='A'?el('nameA').value:el('nameB').value)||('TEAM '+k);
      el('win').classList.remove('wa','wb');
      el('win').classList.add('show', k==='A'?'wa':'wb');
      winFx();
    }
  });
}
document.querySelectorAll('.fins').forEach(box=>{
  const side=box.dataset.side;
  box.querySelectorAll('.fin').forEach(b=>b.addEventListener('click',()=>{
    if(locked)return;
    recordRound(side,b.dataset.f,+b.dataset.p);
    add(side,+b.dataset.p);                // 音效交給 add 判斷：一般加分 vs 直接獲勝
  }));
});
document.querySelectorAll('.adj,.miniAdj').forEach(box=>{
  const side=box.dataset.side;
  box.querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>add(side,+b.dataset.d)));
});
el('target').addEventListener('change',e=>{target=+e.target.value; locked=false; checkWin();});

/* =======================================================================
   自訂倒數錄音（單一完整音檔，存在 IndexedDB）
   ======================================================================= */
const IDB={
  open(){ return new Promise((res,rej)=>{ const r=indexedDB.open('beyx_scorer',1);
    r.onupgradeneeded=()=>r.result.createObjectStore('files');
    r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); }); },
  async put(k,v){ const db=await IDB.open(); return new Promise((res,rej)=>{
    const t=db.transaction('files','readwrite'); t.objectStore('files').put(v,k);
    t.oncomplete=()=>res(); t.onerror=()=>rej(t.error); }); },
  async get(k){ const db=await IDB.open(); return new Promise((res,rej)=>{
    const t=db.transaction('files','readonly'); const q=t.objectStore('files').get(k);
    q.onsuccess=()=>res(q.result); q.onerror=()=>rej(q.error); }); },
  async del(k){ const db=await IDB.open(); return new Promise((res)=>{
    const t=db.transaction('files','readwrite'); t.objectStore('files').delete(k);
    t.oncomplete=()=>res(); }); }
};

const VOICES=[
 {id:'kids',name:'兩個熱血高中生',note:'你自己錄的',cue:[0.14,0.76,1.38,2.00]},
 {id:'tier',name:'天梯情報站',    note:'取自天梯站的倒數',cue:[0.54,1.84,3.06,4.08]},
 {id:'synth',name:'合成音效',     note:'不用人聲，純電子音',cue:[0,1,2,3]}
];
let myVoice=null;                       // 使用者匯入的那一段
let voiceId='kids';
try{ const v=localStorage.getItem('beyx_voice'); if(v) voiceId=v; }catch(e){}

const allVoices=()=>myVoice?VOICES.concat([myVoice]):VOICES;
const findVoice=id=>allVoices().find(v=>v.id===id)||VOICES[0];
function curVoice(){ return findVoice(voiceId); }
function cueOf(v){
  try{ const s=localStorage.getItem('beyx_cue_'+v.id); if(s){const a=JSON.parse(s); if(Array.isArray(a)&&a.length===4)return a;} }catch(e){}
  return v.cue.slice();
}
function saveCueOf(v,a){ try{localStorage.setItem('beyx_cue_'+v.id,JSON.stringify(a));}catch(e){} }

function b64ToBlob(b64,mime){
  const bin=atob(b64), u=new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);
  return new Blob([u],{type:mime||'audio/mp4'});
}
const _url={};
function urlOf(v){
  if(v.url) return v.url;
  if(_url[v.id]) return _url[v.id];
  const b=VOICE_B64[v.id];
  if(!b) return null;
  _url[v.id]=URL.createObjectURL(b64ToBlob(b));
  new Audio(_url[v.id]).preload='auto';
  return _url[v.id];
}

/* ---------- 面板 ---------- */
function paintVoices(){
  const box=el('vlist');
  box.innerHTML=allVoices().map(v=>
    `<button class="vrow${v.id===voiceId?' on':''}" data-id="${v.id}">
       <span class="dot"></span>
       <span class="txt"><b>${v.name}</b><small>${v.note||''}</small></span>
       ${v.id==='mine'?'<span class="del" data-del="1">移除</span>':''}
     </button>`).join('');
  box.querySelectorAll('.vrow').forEach(r=>r.addEventListener('click',e=>{
    if(e.target.dataset.del){ dropMine(); return; }
    voiceId=r.dataset.id;
    try{ localStorage.setItem('beyx_voice',voiceId); }catch(e){}
    paintVoices(); paintCue();
  }));
  el('btnAudio').classList.toggle('on',voiceId!=='synth');
}
function paintCue(){
  const c=cueOf(curVoice());
  [0,1,2,3].forEach(i=>el('c'+i).value=c[i]);
}
[0,1,2,3].forEach(i=>{
  el('c'+i).addEventListener('change',()=>{
    const c=cueOf(curVoice());
    c[i]=Math.max(0,Math.min(20,+el('c'+i).value||0));
    saveCueOf(curVoice(),c); paintCue();
  });
});
el('afReset').addEventListener('click',()=>{
  try{ localStorage.removeItem('beyx_cue_'+curVoice().id); }catch(e){}
  paintCue();
});
el('afTest').addEventListener('click',()=>countdown());
el('afPick').addEventListener('click',()=>el('afInput').click());
el('afInput').addEventListener('change',async e=>{
  const f=e.target.files&&e.target.files[0]; if(!f)return;
  setMine(f,f.name);
  try{ await IDB.put('countdown',{blob:f,name:f.name}); }catch(err){}
  voiceId='mine'; try{localStorage.setItem('beyx_voice','mine');}catch(err){}
  paintVoices(); paintCue(); e.target.value='';
});
function setMine(blob,name){
  if(myVoice&&myVoice.url) URL.revokeObjectURL(myVoice.url);
  myVoice={id:'mine',name:name||'我的錄音',note:'存在這台裝置',cue:[0.2,1.2,2.2,3.2],
           url:URL.createObjectURL(blob)};
  new Audio(myVoice.url).preload='auto';
}
async function dropMine(){
  try{ await IDB.del('countdown'); }catch(e){}
  if(myVoice&&myVoice.url) URL.revokeObjectURL(myVoice.url);
  myVoice=null;
  if(voiceId==='mine'){ voiceId='kids'; try{localStorage.setItem('beyx_voice','kids');}catch(e){} }
  paintVoices(); paintCue();
}
(async()=>{ let rec=null;
  try{ rec=await IDB.get('countdown'); }catch(e){}
  if(rec&&rec.blob) setMine(rec.blob,rec.name);
  paintVoices(); paintCue();
})();

el('btnAudio').addEventListener('click',()=>el('audioSheet').classList.add('show'));
el('afClose').addEventListener('click',()=>el('audioSheet').classList.remove('show'));
el('audioSheet').addEventListener('click',e=>{ if(e.target.id==='audioSheet')e.currentTarget.classList.remove('show'); });

/* ---------- 3 2 1 GO SHOOT ---------- */
let counting=false;
function countdown(){
  if(counting)return; counting=true;
  const v=curVoice(), url=urlOf(v), custom=!!url;
  if(!custom) ensureAudio();
  const cd=el('cd'), n=el('cdn');
  // 先清空，否則會殘留上一輪最後停在的「GO SHOOT!」，在 3 出現前閃一下
  n.className='n'; n.textContent='';
  cd.classList.add('show');

  let times=cueOf(v), tailMs=1100, au=null;
  if(custom){
    if(SFX.cd){ try{ au=new Audio(url); au.play().catch(()=>{}); }catch(e){} }
    const known={kids:2.41,tier:5.74};
    const dur=known[v.id]||(au&&isFinite(au.duration)?au.duration:times[3]+1.2);
    tailMs=Math.max(700,(dur-times[3])*1000+300);
  }
  const seq=[
    {txt:'3',        word:false, f:520},
    {txt:'2',        word:false, f:520},
    {txt:'1',        word:false, f:520},
    {txt:'GO SHOOT!',word:true,  f:0}
  ];
  seq.forEach((step,i)=>setTimeout(()=>{
    n.classList.remove('n'); void n.offsetWidth; n.className='n'+(step.word?' word':'');
    n.textContent=step.txt;
    if(custom)return;                    // 有自己的錄音就不再疊合成音
    if(step.f){ beep(step.f,.16,.3,'square','cd'); say(step.txt); }
    else { sweep(); say('Go Shoot'); }
  },times[i]*1000));
  setTimeout(()=>{ cd.classList.remove('show'); n.className='n'; n.textContent=''; counting=false; },
             times[3]*1000+tailMs);
}

/* =======================================================================
   戰績卡：Canvas 繪製 → 內嵌 JPEG 的單頁 PDF（不依賴任何外部套件）
   ======================================================================= */
const teamName=k=>(el('name'+k).value||'').trim()||('TEAM '+k);
const FT=(w,s)=>`${w} ${s}px system-ui,-apple-system,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif`;
function ell(g,t,max){ if(g.measureText(t).width<=max)return t;
  let s=t; while(s.length>1&&g.measureText(s+'…').width>max)s=s.slice(0,-1); return s+'…'; }
function fitFont(g,t,max,start,min){ let f=start;
  do{ g.font=FT(900,f); if(g.measureText(t).width<=max)break; f-=4; }while(f>min); return f; }

function drawCard(){
  const W=1240,H=1754,M=88;
  const c=document.createElement('canvas'); c.width=W; c.height=H;
  const g=c.getContext('2d');
  try{ g.letterSpacing='0px'; }catch(e){}

  g.fillStyle='#04060f'; g.fillRect(0,0,W,H);
  [[0.10,'rgba(224,31,45,.34)'],[0.90,'rgba(45,140,255,.34)']].forEach(([px,col])=>{
    const rg=g.createRadialGradient(W*px,H*1.04,0,W*px,H*1.04,W*1.15);
    rg.addColorStop(0,col); rg.addColorStop(1,'rgba(0,0,0,0)');
    g.fillStyle=rg; g.fillRect(0,0,W,H);
  });

  const line=(y,a)=>{ g.strokeStyle=`rgba(255,255,255,${a||.1})`; g.lineWidth=2;
    g.beginPath(); g.moveTo(M,y); g.lineTo(W-M,y); g.stroke(); };
  const now=new Date();
  const stamp=`${now.getFullYear()}.${String(now.getMonth()+1).padStart(2,'0')}.${String(now.getDate()).padStart(2,'0')}  ${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;

  /* 頁首 */
  try{ g.letterSpacing='7px'; }catch(e){}
  g.font=FT(800,24); g.fillStyle='#7c8098'; g.textAlign='left';
  g.fillText('BEYBLADE X · MATCH REPORT',M,120);
  try{ g.letterSpacing='2px'; }catch(e){}
  g.textAlign='right'; g.fillText(stamp,W-M,120);
  try{ g.letterSpacing='0px'; }catch(e){}

  /* 勝方 */
  const wk=S.A>=S.B?'A':'B';
  g.textAlign='center';
  try{ g.letterSpacing='12px'; }catch(e){}
  g.font=FT(800,26); g.fillStyle=wk==='A'?'#ff5a68':'#4dd8f0';
  g.fillText('WINNER',W/2,238);
  try{ g.letterSpacing='0px'; }catch(e){}
  const wn=teamName(wk);
  const wf=fitFont(g,wn,W-M*2,104,44);
  const grd=g.createLinearGradient(0,270,0,270+wf);
  grd.addColorStop(0,'#ffffff'); grd.addColorStop(1,wk==='A'?'#e01f2d':'#1b5fd6');
  g.font=FT(900,wf); g.fillStyle=grd; g.fillText(wn,W/2,290+wf*0.55);

  /* 比分 */
  const sy=470;
  g.font=FT(700,30); g.fillStyle='#8b8fa8';
  g.textAlign='right'; g.fillText(ell(g,teamName('A'),380),W/2-110,sy);
  g.textAlign='left';  g.fillText(ell(g,teamName('B'),380),W/2+110,sy);
  g.font=FT(900,132);
  g.textAlign='right'; g.fillStyle='#ff5a68'; g.fillText(String(S.A),W/2-70,sy+130);
  g.textAlign='left';  g.fillStyle='#4dc4f0'; g.fillText(String(S.B),W/2+70,sy+130);
  g.textAlign='center'; g.font=FT(300,80); g.fillStyle='#4a4d61'; g.fillText(':',W/2,sy+124);

  /* 回合戰報 */
  let y=690; line(y); y+=62;
  try{ g.letterSpacing='6px'; }catch(e){}
  g.textAlign='left'; g.font=FT(800,20); g.fillStyle='#7c8098'; g.fillText('回合戰報',M,y);
  try{ g.letterSpacing='0px'; }catch(e){}
  y+=46;

  const list=thisMatch(), MAXR=9, show=list.slice(0,MAXR);
  const colA=M+66, colAW=346, colBW=346, rowH=76;
  if(!show.length){
    g.font=FT(400,22); g.fillStyle='#5b5f75'; g.textAlign='center';
    g.fillText('本場沒有逐回合紀錄',W/2,y+40); y+=90;
  }
  show.forEach((r,i)=>{
    const top=y+i*rowH;
    g.fillStyle='rgba(255,255,255,.035)';
    g.beginPath();
    if(g.roundRect) g.roundRect(M,top,W-M*2,rowH-10,14); else g.rect(M,top,W-M*2,rowH-10);
    g.fill();
    g.strokeStyle=r.w==='A'?'rgba(224,31,45,.45)':'rgba(214,75,255,.45)';
    g.lineWidth=2; g.stroke();
    const mid=top+(rowH-10)/2;

    g.textAlign='left'; g.font=FT(800,17); g.fillStyle='#5b5f75';
    g.fillText('R'+(i+1),M+20,mid+6);

    g.font=FT(r.w==='A'?700:400,21);
    g.fillStyle=r.w==='A'?'#eef0ff':'#6f7389';
    g.fillText(ell(g,(r.w==='A'?'▸ ':'')+r.A.combo,colAW),colA,mid+1);
    g.font=FT(400,13); g.fillStyle='#5b5f75';
    g.fillText(`${r.A.idx} 號機`,colA,mid+22);

    g.textAlign='center'; g.font=FT(800,19); g.fillStyle='#c9cbe0';
    g.fillText(FIN[r.f].n,W/2,mid+1);
    g.font=FT(400,13); g.fillStyle='#5b5f75';
    g.fillText(`${FIN[r.f].z} +${r.p}`,W/2,mid+22);

    const rx=W-M-20;
    g.textAlign='right'; g.font=FT(r.w==='B'?700:400,21);
    g.fillStyle=r.w==='B'?'#eef0ff':'#6f7389';
    g.fillText(ell(g,(r.w==='B'?'▸ ':'')+r.B.combo,colBW),rx,mid+1);
    g.font=FT(400,13); g.fillStyle='#5b5f75';
    g.fillText(`${r.B.idx} 號機`,rx,mid+22);
  });
  y+=show.length*rowH;
  if(list.length>MAXR){
    g.textAlign='center'; g.font=FT(400,17); g.fillStyle='#5b5f75';
    g.fillText(`⋯ 另有 ${list.length-MAXR} 個回合`,W/2,y+26); y+=48;
  }

  /* 登錄陣容 */
  let cy=Math.max(y+52,H-430); line(cy); cy+=60;
  try{ g.letterSpacing='6px'; }catch(e){}
  g.textAlign='left'; g.font=FT(800,20); g.fillStyle='#7c8098'; g.fillText('登錄陣容',M,cy);
  try{ g.letterSpacing='0px'; }catch(e){}
  cy+=44;
  ['A','B'].forEach((k,ci)=>{
    const x=ci===0?M:W/2+16, w=W/2-M-16;
    g.textAlign='left'; g.font=FT(800,18);
    g.fillStyle=k==='A'?'#ff5a68':'#4dc4f0';
    g.fillText(ell(g,teamName(k),w),x,cy);
    sel[k].forEach((s,i)=>{
      const t=comboText(s)||'（未登錄）';
      g.font=FT(400,18); g.fillStyle='#c9cbe0';
      g.fillText(ell(g,`${i+1}. ${t}`,w),x,cy+34+i*30);
    });
  });

  /* 頁尾 */
  g.textAlign='center'; g.font=FT(400,15); g.fillStyle='#464a5e';
  g.fillText('由 BEYBLADE X 比賽計分板產生',W/2,H-58);
  return c;
}

async function shareReport(){
  const btn=el('winShare'), hint=el('shareHint');
  btn.disabled=true; btn.textContent='產生中…'; hint.textContent='';
  try{
    const canvas=drawCard();
    const blob=await new Promise(res=>canvas.toBlob(res,'image/jpeg',0.95));
    if(!blob) throw new Error('無法產生圖片');
    const d=new Date();
    const name=`戰績_${teamName('A')}_vs_${teamName('B')}_`+
      `${d.getFullYear()}${String(d.getMonth()+1).padStart(2,'0')}${String(d.getDate()).padStart(2,'0')}`+
      `${String(d.getHours()).padStart(2,'0')}${String(d.getMinutes()).padStart(2,'0')}.jpg`;

    const file=new File([blob],name,{type:'image/jpeg'});
    if(navigator.canShare&&navigator.canShare({files:[file]})){
      await navigator.share({files:[file],title:`${teamName('A')} ${S.A} : ${S.B} ${teamName('B')}`});
      hint.textContent='已開啟分享選單 · 選「儲存影像」可存進相簿';
    }else{
      const url=URL.createObjectURL(blob);
      const a=document.createElement('a'); a.href=url; a.download=name;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(()=>URL.revokeObjectURL(url),4000);
      hint.textContent='已下載 '+name;
    }
  }catch(err){
    hint.textContent='產生失敗：'+(err&&err.message?err.message:err);
  }finally{
    btn.disabled=false; btn.textContent='分享戰績';
  }
}
el('winShare').addEventListener('click',shareReport);

/* =======================================================================
   陀螺配置（可搜尋下拉選單）
   ======================================================================= */
const FIELDS=[
  {key:'blade',  label:'戰刃 BLADE'},
  {key:'ratchet',label:'固鎖 RATCHET'},
  {key:'bit',    label:'軸心 BIT'},
  {key:'assist', label:'輔助戰刃 ASSIST（選填）'}
];
const MAXBEY=3;
const blank=()=>({blade:'',ratchet:'',bit:'',assist:'',done:false});
const sel={A:[blank()],B:[blank()]};   // 每邊最多三顆陀螺
const active={A:0,B:0};                // 本回合上場的是第幾顆
const CN=['①','②','③'];

function find(key,name){ return DATA[key].find(o=>o.name===name); }
function optHTML(o){
  return `<div class="opt" data-name="${o.name}">
    <span class="tier ${tierCls(o.tier)}">${o.tier}</span>
    <span>${o.name}</span>${o.type?`<span class="ty">${o.type}</span>`:''}</div>`;
}

function wireCombo(cb,side,idx,key){
  const inp=cb.querySelector('input'), list=cb.querySelector('.list');
  const cur=()=>sel[side][idx][key]||'';
  const draw=q=>{
    const ql=(q||'').trim().toLowerCase();
    const items=DATA[key].filter(o=>!ql||o.name.toLowerCase().includes(ql)||
      (o.type||'').toLowerCase().includes(ql)||o.tier.toLowerCase()===ql);
    list.innerHTML=items.length?items.map(optHTML).join(''):'<div class="opt" style="color:#777">查無零件</div>';
  };
  inp.value=cur();
  inp.addEventListener('focus',()=>{draw(inp.value===cur()?'':inp.value);list.classList.add('show');});
  inp.addEventListener('input',()=>{draw(inp.value);list.classList.add('show');});
  list.addEventListener('mousedown',e=>{
    const o=e.target.closest('.opt'); if(!o||!o.dataset.name)return;
    e.preventDefault();
    sel[side][idx][key]=o.dataset.name; sel[side][idx].done=false; inp.value=o.dataset.name;
    list.classList.remove('show'); inp.blur(); refresh(side);
  });
  inp.addEventListener('blur',()=>setTimeout(()=>{
    list.classList.remove('show');
    if(inp.value!==cur()) inp.value=cur();
  },120));
  cb.querySelector('.clr').addEventListener('click',()=>{
    sel[side][idx][key]=''; sel[side][idx].done=false; inp.value=''; refresh(side);
  });
}

function comboText(s){
  const parts=['blade','ratchet','bit'].map(k=>s[k]).filter(Boolean);
  return (s.assist?s.assist+' ':'')+parts.join(' ');
}
function tierTags(s){
  return ['blade','ratchet','bit','assist'].filter(k=>s[k]).map(k=>{
    const o=find(k,s[k]); return o?`<span class="tier ${tierCls(o.tier)}">${o.tier}</span>`:'';
  }).join(' ');
}

/* 正式格式：戰刃 [輔助戰刃] 固鎖 軸心 */
function officialName(s){
  return [s.blade,s.assist,s.ratchet,s.bit].filter(Boolean).join(' ');
}
const SLOT=[{k:'blade',z:'戰刃'},{k:'assist',z:'輔助戰刃'},{k:'ratchet',z:'固鎖'},{k:'bit',z:'軸心'}];
function stripHTML(s){
  return `<div class="strip">${SLOT.map(o=>{
    const v=s[o.k];
    if(!v) return `<div class="cell off"><div class="ph empty"><span class="fb">未使用</span></div>
      <b>—</b><span class="slot">${o.z}</span></div>`;
    const url=partImg(v), p=find(o.k,v);
    return `<div class="cell">
      <div class="ph">${url?`<img src="${url}" alt="${v}" loading="lazy" referrerpolicy="no-referrer">`
                        :`<span class="fb">${v}</span>`}</div>
      <b>${v}</b><span class="slot">${o.z}</span></div>`;
  }).join('')}</div>`;
}
function beyReady(s){ return !!(s.blade&&s.ratchet&&s.bit); }

function buildCard(side){
  const card=el('card'+side);
  card.innerHTML='<h3>'+(side==='A'?'TEAM A 陣容':'TEAM B 陣容')+'</h3>'+
    sel[side].map((s,i)=>`
      <div class="bey">
        <div class="beyHead">
          <span class="no">${CN[i]} 陀螺 ${i+1}</span><span class="sp"></span>
          ${s.done?`<button class="edit" data-i="${i}">編輯</button>`:''}
          ${sel[side].length>1?`<button class="del" data-side="${side}" data-i="${i}">移除這顆</button>`:''}
        </div>
        ${s.done ? stripHTML(s)+
          `<div class="official">${officialName(s)}
             <small>${(s.blade&&find('blade',s.blade)&&find('blade',s.blade).type)||''}</small></div>`
        : FIELDS.map(f=>`<div class="row"><label>${f.label}</label>
          <div class="cb" data-side="${side}" data-i="${i}" data-key="${f.key}">
            <input type="text" placeholder="輸入關鍵字搜尋…" autocomplete="off">
            <button class="clr" title="清除">×</button>
            <div class="list"></div>
          </div></div>`).join('')+
          `<div class="summary">${comboText(s)||'—'}</div>
           <button class="okBtn" data-i="${i}" ${beyReady(s)?'':'disabled'}>
             ${beyReady(s)?'確認這顆':'請先選好 戰刃 / 固鎖 / 軸心'}</button>`}
      </div>`).join('')+
    `<button class="addBey" data-side="${side}" ${sel[side].length>=MAXBEY?'disabled':''}>
       ${sel[side].length>=MAXBEY?'已滿 3 顆':'＋ 新增下一顆陀螺（'+sel[side].length+'/3）'}</button>`;

  card.querySelectorAll('.cb').forEach(cb=>wireCombo(cb,side,+cb.dataset.i,cb.dataset.key));
  card.querySelectorAll('.okBtn').forEach(b=>b.addEventListener('click',()=>{
    sel[side][+b.dataset.i].done=true; refresh(side);
  }));
  card.querySelectorAll('.edit').forEach(b=>b.addEventListener('click',()=>{
    sel[side][+b.dataset.i].done=false; refresh(side);
  }));
  // 圖片載不出來就退回文字，不留破圖
  card.querySelectorAll('.cell .ph img').forEach(im=>im.addEventListener('error',()=>{
    const ph=im.parentNode; ph.innerHTML='<span class="fb">'+(im.alt||'無圖')+'</span>';
  }));
  card.querySelectorAll('.del').forEach(b=>b.addEventListener('click',()=>{
    sel[side].splice(+b.dataset.i,1); refresh(side);
  }));
  const add=card.querySelector('.addBey');
  add.addEventListener('click',()=>{
    if(sel[side].length>=MAXBEY)return;
    sel[side].push(blank()); refresh(side);
  });
}

function paintCombos(side){
  const box=el('combo'+side);
  if(active[side]>=sel[side].length) active[side]=0;
  box.classList.toggle('single',sel[side].length<2);
  box.innerHTML=sel[side].map((s,i)=>{
    const t=comboText(s)||'（未登錄）';
    const blade=s.blade?find('blade',s.blade):null;
    return `<div class="cline${i===active[side]?' on':''}" data-i="${i}" title="設為本回合上場">
      <span class="num">${i+1}</span>
      <span class="txt">${t}</span>
      ${blade&&blade.type?`<span class="tp">${blade.type}</span>`:''}</div>`;
  }).join('');
  box.querySelectorAll('.cline').forEach(l=>l.addEventListener('click',()=>{
    if(sel[side].length<2)return;
    active[side]=+l.dataset.i; paintCombos(side);
  }));
}
function refresh(side){ buildCard(side); paintCombos(side); }
refresh('A'); refresh('B');

/* =======================================================================
   回合戰報 + 累積統計
   ======================================================================= */
const FIN={spin:{n:'Spin',z:'回轉勝',p:1},burst:{n:'Burst',z:'爆裂勝',p:2},
           over:{n:'Over',z:'場外勝',p:2},xtreme:{n:'Xtreme',z:'極限勝',p:3}};
let rounds=[];
try{ rounds=JSON.parse(localStorage.getItem('beyx_rounds')||'[]'); }catch(e){ rounds=[]; }
const saveRounds=()=>{ try{localStorage.setItem('beyx_rounds',JSON.stringify(rounds.slice(-800)));}catch(e){} };

function snap(side){
  const s=sel[side][active[side]]||blank();
  const blade=s.blade?find('blade',s.blade):null;
  return {combo:comboText(s)||'（未登錄）',blade:s.blade||'',ratchet:s.ratchet||'',
          bit:s.bit||'',assist:s.assist||'',type:blade?blade.type:'',
          idx:active[side]+1,team:(el('name'+side).value||('TEAM '+side)).trim()};
}
function recordRound(winner,fin,pts){
  rounds.push({t:Date.now(),w:winner,f:fin,p:pts,A:snap('A'),B:snap('B'),
               m:matchId});
  saveRounds(); paintLog();
}
function undoRound(){
  // 只撤銷本場的最後一回合
  const i=[...rounds].reverse().findIndex(r=>r.m===matchId);
  if(i<0)return false;
  const r=rounds.splice(rounds.length-1-i,1)[0];
  S[r.w]=Math.max(0,S[r.w]-r.p);
  locked=false; winShown=false; el('win').classList.remove('show');
  render(r.w); saveRounds(); paintLog();
  beep(320,.1,.16,'sine');
  return true;
}
let matchId=Date.now();
const thisMatch=()=>rounds.filter(r=>r.m===matchId);

function sideCell(r,side,cls){
  const d=r[side], win=r.w===side;
  return `<div class="sd ${cls}${win?'':' lose'}">
    <b>${win?'▸ ':''}${d.combo}</b>
    <small>${d.team} · ${d.idx} 號機${d.type?' · '+d.type:''}</small></div>`;
}
function paintRounds(){
  const list=thisMatch();
  if(!list.length) return `<div class="empty">本場還沒有紀錄。選好雙方本回合上場的陀螺，按下獲勝方的 Finish 按鈕就會記一筆。</div>`;
  return list.map((r,i)=>`<div class="rnd w${r.w.toLowerCase()}">
      <span class="rn">R${i+1}</span>
      ${sideCell(r,'A','l')}
      <div class="fx"><b>${FIN[r.f].n}</b><small>${FIN[r.f].z} +${r.p}</small></div>
      ${sideCell(r,'B','r')}
    </div>`).reverse().join('');
}

function tally(){
  const combo={}, fin={spin:0,burst:0,over:0,xtreme:0}, bitLoss={};
  rounds.forEach(r=>{
    fin[r.f]=(fin[r.f]||0)+1;
    ['A','B'].forEach(k=>{
      const d=r[k]; if(d.combo==='（未登錄）')return;
      const c=combo[d.combo]||(combo[d.combo]={n:d.combo,w:0,l:0,type:d.type,bit:d.bit});
      r.w===k?c.w++:c.l++;
    });
    const loser=r.w==='A'?'B':'A', lb=r[loser].bit;
    if(lb){ const b=bitLoss[lb]||(bitLoss[lb]={n:lb,over:0,burst:0,xtreme:0,spin:0,tot:0});
            b[r.f]++; b.tot++; }
  });
  return {combo:Object.values(combo),fin,bitLoss:Object.values(bitLoss)};
}
function pct(w,t){ return t?Math.round(w/t*100):0; }
function paintStats(){
  if(!rounds.length) return `<div class="empty">還沒有累積資料。打幾場之後這裡就會長出勝率表。</div>`;
  const {combo,fin,bitLoss}=tally();
  combo.sort((a,b)=>(b.w+b.l)-(a.w+a.l)||b.w-a.w);
  bitLoss.sort((a,b)=>b.over-a.over||b.tot-a.tot);
  const finTot=Object.values(fin).reduce((a,b)=>a+b,0);

  const t1=`<div class="stat"><h4>配置勝率</h4>
    <table class="st"><thead><tr><th>配置</th><th>屬性</th><th>出場</th><th>勝</th><th>敗</th><th>勝率</th></tr></thead><tbody>
    ${combo.map(c=>{const t=c.w+c.l,p=pct(c.w,t);return `<tr>
      <td>${c.n}</td><td>${c.type||'—'}</td><td>${t}</td><td>${c.w}</td><td>${c.l}</td>
      <td><span class="wr"><span class="bar"><i style="width:${p}%"></i></span>${p}%</span></td></tr>`}).join('')}
    </tbody></table></div>`;

  const t2=`<div class="stat"><h4>Finish 分布</h4>
    <table class="st"><thead><tr><th>方式</th><th>次數</th><th>佔比</th></tr></thead><tbody>
    ${Object.keys(FIN).map(k=>{const p=pct(fin[k],finTot);return `<tr>
      <td>${FIN[k].n} · ${FIN[k].z}</td><td>${fin[k]}</td>
      <td><span class="wr"><span class="bar"><i style="width:${p}%"></i></span>${p}%</span></td></tr>`}).join('')}
    </tbody></table></div>`;

  const t3=bitLoss.length?`<div class="stat"><h4>軸心 被擊敗次數</h4>
    <p class="statNote">依「被場外」次數排序 —— 數字高代表這個軸心在你的場地上抓地力不足。</p>
    <table class="st"><thead><tr><th>軸心</th><th>被場外</th><th>被爆裂</th><th>被極限</th><th>被回轉</th><th>合計敗場</th></tr></thead><tbody>
    ${bitLoss.map(b=>`<tr><td>${b.n}</td><td>${b.over}</td><td>${b.burst}</td>
      <td>${b.xtreme}</td><td>${b.spin}</td><td>${b.tot}</td></tr>`).join('')}
    </tbody></table></div>`:'';

  return t1+t2+t3+`<p class="statNote">累積 ${rounds.length} 個回合，資料存在這台裝置的瀏覽器裡。</p>`;
}

let logTab='rounds';
function paintLog(){ el('logBody').innerHTML=logTab==='rounds'?paintRounds():paintStats(); }
document.querySelectorAll('.ltab').forEach(b=>b.addEventListener('click',()=>{
  logTab=b.dataset.t;
  document.querySelectorAll('.ltab').forEach(x=>x.classList.toggle('on',x===b));
  paintLog();
}));
el('undoRound').addEventListener('click',()=>{ if(!undoRound()) beep(220,.12,.14,'sine'); });
el('clearStats').addEventListener('click',()=>{
  if(!rounds.length)return;
  if(!confirm('確定清除全部累積回合資料？此動作無法復原。'))return;
  rounds=[]; saveRounds(); paintLog();
});
el('btnLog').addEventListener('click',e=>{
  const c=el('log'); c.classList.toggle('show');
  e.currentTarget.classList.toggle('on',c.classList.contains('show'));
  if(c.classList.contains('show')){ paintLog(); c.scrollIntoView({behavior:'smooth',block:'start'}); }
});
paintLog();

el('btnCfg').addEventListener('click',e=>{
  const c=el('cfg'); c.classList.toggle('show');
  e.currentTarget.classList.toggle('on',c.classList.contains('show'));
  if(c.classList.contains('show')) c.scrollIntoView({behavior:'smooth',block:'start'});
});

render();

/* ---------- 診斷面板：找出底部黑帶的真正成因 ---------- */
(function(){
  const box=el('diag'), edge=el('diagEdge');
  const probe=document.createElement('div');
  probe.style.cssText='position:fixed;top:0;left:0;visibility:hidden;'+
    'padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)';
  document.body.appendChild(probe);
  const dump=()=>{
    const cs=getComputedStyle(probe);
    const de=document.documentElement, vv=window.visualViewport;
    box.textContent=
      'standalone      '+(window.navigator.standalone)+'  |  dpr '+devicePixelRatio+'\n'+
      'innerHeight     '+innerHeight+'\n'+
      'outerHeight     '+outerHeight+'\n'+
      'html.clientH    '+de.clientHeight+'\n'+
      'html.scrollH    '+de.scrollHeight+'\n'+
      'body.offsetH    '+document.body.offsetHeight+'\n'+
      'visualViewport  '+(vv?Math.round(vv.height)+' offsetTop '+Math.round(vv.offsetTop):'無')+'\n'+
      'screen          '+screen.width+'×'+screen.height+'\n'+
      '100dvh 實測     '+dvh()+'\n'+
      'safe-area  上'+cs.paddingTop+' 下'+cs.paddingBottom+' 左'+cs.paddingLeft+' 右'+cs.paddingRight+'\n'+
      'scrollY         '+Math.round(scrollY);
  };
  const dvh=()=>{const t=document.createElement('div');
    t.style.cssText='position:absolute;top:0;height:100dvh;width:1px;visibility:hidden';
    document.body.appendChild(t); const v=t.offsetHeight; t.remove(); return v;};
  // 需要再查時，網址後面加 #diag 就會出現
  const sync=()=>{ const on=location.hash==='#diag';
    box.classList.toggle('show',on); edge.classList.toggle('show',on); if(on)dump(); };
  addEventListener('hashchange',sync); sync();
  ['resize','orientationchange','scroll'].forEach(t=>addEventListener(t,()=>{ if(box.classList.contains('show')) dump(); }));
})();

/* ---------- 鎖住縮放（Safari 分頁會忽略 user-scalable，得自己擋） ---------- */
['gesturestart','gesturechange','gestureend'].forEach(t=>
  document.addEventListener(t,e=>e.preventDefault(),{passive:false}));
document.addEventListener('dblclick',e=>e.preventDefault(),{passive:false});

/* ---------- PWA：離線與加入主畫面 ---------- */
if('serviceWorker' in navigator && location.protocol.startsWith('http')){
  window.addEventListener('load',()=>{ navigator.serviceWorker.register('./sw.js').catch(()=>{}); });
}
</script>
